services:
  # --- THE DATABASE ---
  infra-postgres:
      build:
        context: .
        dockerfile_inline: FROM postgres:15-alpine
      image: ${INFRA_SQL_DB_IMAGE_NAME}
      container_name: ${INFRA_SQL_DB_CONTAINER_NAME}
      # OVERRIDE THE ENTRYPOINT
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      networks:
        - infra-storage
      volumes:
        - infra-db-data:/var/lib/postgresql/data
      deploy:
        resources:
          limits:
            memory: 512M


  infra-finance-tracker:
    build:
      context: .
      dockerfile_inline: FROM fireflyiii/core:latest
    container_name: ${FIN_CONTAINER_NAME}-firefly
    image: ${FIN_IMAGE_NAME}-firefly
    ports:
      - "${FIREFLY_PORT}:8080"
    env_file:
      - .env
    networks:
      - infra-storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - infra-firefly-data:/var/www/html/storage
      - infra-firefly-data:/var/www/html/export
      - infra-firefly-data:/var/www/html/storage/upload

networks:
  infra-storage:
    external: true

volumes:
  infra-db-data:
    name: infra-db-data
  infra-firefly-data:
    name: infra-firefly-data