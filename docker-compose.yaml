services:
  # --- THE DATABASE ---
  
  tools-omnitool:
    build:
      context: .
      dockerfile_inline: FROM iib0011/omni-tools
    container_name: tools-omnitool
    image: tools-omnitool
    ports:
      - "${OMNITOOL_PORT}:80"
    networks:
      - tools-network
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped


  
  # --- PDF UTILITY ---
  tools-bentopdf:
    build:
      context: .
      dockerfile_inline: FROM bentopdf/bentopdf:latest
    container_name: tools-bentopdf
    image: tools-bentopdf
    ports:
      - "${BENTOPDF_PORT}:8080"
    networks:
      - tools-network
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
  
  # --- NETWORK DNS & AD BLOCKER ---
  tools-pihole:
    build:
        context: .
        dockerfile_inline: FROM pihole/pihole:latest
    image: tools-pihole
    container_name: tools-pihole
    env_file: .env
    ports:
      # Binds strictly to your PC's LAN IP so only the network can see it
      - "${HOST_IP_ADDRESS}:53:53/tcp"  
      - "${HOST_IP_ADDRESS}:53:53/udp"
      - "${PIHOLE_WEB_PORT:-8089}:80/tcp"
    environment:
      - TZ=Asia/Kolkata
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD:-admin}
      - FTLCONF_dns_listeningMode=all
    volumes:
      - tools-pihole-config:/etc/pihole
      - tools-pihole-dns:/etc/dnsmasq.d
    networks:
      - tools-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
  

  # --- MONITORING ---
  tools-glances:
    build:
        context: .
        dockerfile_inline: FROM nicolargo/glances:latest
    image: tools-glances
    container_name: tools-glances
    pid: host
    privileged: true
    ports:
      - "${GLANCES_PORT:-61220}:61220"
    environment:
      - GLANCES_OPT=-w -p 61220 -t 3 --enable-plugin sensors,network,docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - tools-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
  
  # --- ADVANCED PDF UTILITY (Stirling PDF) ---
  tools-stirling-pdf:
    build:
        context: .
        dockerfile_inline: FROM docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    image: tools-stirling-pdf
    container_name: tools-stirling-pdf
    ports:
      - "${STIRLING_PDF_PORT:-8082}:8080"
    environment:
      - DOCKER_ENABLE_SECURITY=false
    volumes:
      - tools-stirling-configs:/configs
    networks:
      - tools-network
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped


networks:
  tools-network:
    name: tools-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.5.0.0/24

volumes:
  tools-pihole-config:
    name: tools-pihole-config
  tools-pihole-dns:
    name: tools-pihole-dns
  tools-stirling-configs:
    name: tools-stirling-configs